project:
  type: website
  # Root-level .qmd pages plus everything under posts/. Root .md files such as
  # quickstart.md are docs for contributors, not site pages, so they are not rendered.
  render:
    - "*.qmd"
    - "posts/**"

website:
  title: "Detour De Force"
  site-url: "https://detourdeforce.net"
  description: "Julian and Andres Noodling"
  navbar:
    right:
      - about.qmd
      - icon: github
        href: https://github.com/andresnmejia
      - icon: rss
        href: index.xml

format:
  html:
    theme:
      - litera
      - styles.scss
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    code-copy: true

execute:
  warning: false